<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Authentication Example</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Google Firebase Authentication</h1>
    <button id="googleSignInButton">Se connecter avec Google</button>
    <div id="userInfo" class="hidden">
      <h2>Informations utilisateur :</h2>
      <p><strong>Nom :</strong> <span id="userName"></span></p>
      <p><strong>Email :</strong> <span id="userEmail"></span></p>
      <img id="userPhoto" alt="Photo de profil" />
      <button id="signOutButton">Se déconnecter</button>
    </div>
  </div>
  <script type="module" src="config.js"></script>
</body>
</html>
